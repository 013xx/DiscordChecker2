<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discord Username Checker</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.card{width:min(680px,100%);padding:34px;border:1px solid #252b36;border-radius:24px;background:#12151c;box-shadow:0 25px 80px #0008}.badge{font-size:12px;font-weight:800;letter-spacing:.08em;color:#aab8ff;background:#1c2230;border-radius:999px;padding:7px 11px}h1{font-size:42px;margin:18px 0 8px}p{color:#929aaa}.row{display:flex;gap:10px;margin-top:24px}input{flex:1;background:#0c0f15;border:1px solid #303744;color:#fff;border-radius:13px;padding:15px;font-size:16px}button{border:0;border-radius:13px;background:#5865f2;color:#fff;font-weight:800;padding:0 22px;cursor:pointer}.result{margin-top:18px;border:1px solid #252b36;border-radius:15px;padding:18px;background:#0e1117}.status{font-weight:900}.sub{color:#8f98a8;font-size:13px;margin-top:5px}@media(max-width:560px){.row{flex-direction:column}button{height:50px}h1{font-size:34px}}
</style></head><body><main class="card"><span class="badge">LIVE DISCORD CHECK</span><h1>Username Checker</h1><p>Check a Discord username and get a verified Discord response.</p>
<form id="f" class="row"><input id="u" maxlength="32" autocomplete="off" placeholder="username"><button>Check</button></form>
<div id="r" class="result"><div class="status">Ready</div><div class="sub">Enter a username to check.</div></div></main>
<script>
const f=document.querySelector("#f"),u=document.querySelector("#u"),r=document.querySelector("#r");
const show=(a,b)=>r.innerHTML='<div class="status">'+a+'</div><div class="sub">'+b+'</div>';
f.onsubmit=async e=>{e.preventDefault();let x=u.value.trim().toLowerCase();if(!x)return show("INVALID","Enter a username.");show("CHECKING","Contacting the checker server...");let b=f.querySelector("button");b.disabled=true;try{let q=await fetch("/api/discord/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:x})}),d=await q.json();if(d.status==="available")show("VERIFIED / UNTAKEN",x+" is available.");else if(d.status==="taken")show("VERIFIED / TAKEN",x+" is taken.");else if(d.status==="rate_limited")show("RATE LIMITED","Please wait before checking again.");else if(d.status==="invalid")show("INVALID","Discord rejected this username.");else show("UNVERIFIED","Discord returned HTTP "+(d.discordStatus||q.status)+".");}catch(err){show("UNVERIFIED","Could not reach the checker server.")}finally{b.disabled=false}};
</script></body></html>
